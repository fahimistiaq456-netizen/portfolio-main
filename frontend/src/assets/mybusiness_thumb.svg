<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="phoneBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070d19" />
      <stop offset="50%" stop-color="#0c162c" />
      <stop offset="100%" stop-color="#060b14" />
    </linearGradient>

    <linearGradient id="m3Card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="chartLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="arcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <filter id="m3Glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="phoneGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="rgba(20, 184, 166, 0.06)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="#040812" />
  <rect width="800" height="600" fill="url(#phoneGrid)" />

  <circle cx="280" cy="300" r="180" fill="#14b8a6" opacity="0.12" filter="url(#m3Glow)" />
  <circle cx="600" cy="220" r="160" fill="#6366f1" opacity="0.1" filter="url(#m3Glow)" />

  <!-- LEFT: Android Smartphone Mockup with Jetpack Compose UI -->
  <g transform="translate(70, 30)">
    <!-- Outer Phone Shadow & Bezel -->
    <rect width="300" height="540" rx="36" fill="#020408" stroke="rgba(45, 212, 191, 0.4)" stroke-width="2.5" />
    <rect x="6" y="6" width="288" height="528" rx="30" fill="#091122" />

    <!-- Punch Hole Camera & Speaker -->
    <circle cx="150" cy="20" r="4.5" fill="#020408" stroke="#1e293b" stroke-width="1" />

    <!-- Status Bar -->
    <text x="24" y="24" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">10:42</text>
    <g transform="translate(245, 15)">
      <!-- 5G & Battery icon -->
      <path d="M0 8 L3 8 L3 5 L6 5 L6 2 L9 2 L9 8" stroke="#94a3b8" stroke-width="1.2" fill="none" />
      <rect x="14" y="1" width="16" height="8" rx="2" fill="none" stroke="#94a3b8" stroke-width="1.2" />
      <rect x="16" y="3" width="10" height="4" rx="1" fill="#2dd4bf" />
    </g>

    <!-- App Header & Live Weather Widget -->
    <g transform="translate(20, 42)">
      <text x="0" y="16" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="1">ENTERPRISE PORTFOLIO</text>
      <text x="0" y="36" fill="#f8fafc" font-family="'Inter', sans-serif" font-size="16" font-weight="900">MyBusinessApp</text>

      <!-- Live Weather Chip -->
      <g transform="translate(165, 8)">
        <rect width="95" height="26" rx="13" fill="rgba(20, 184, 166, 0.18)" stroke="rgba(20, 184, 166, 0.4)" stroke-width="1" />
        <text x="12" y="17" fill="#fbbf24" font-size="11">☀️</text>
        <text x="32" y="17" fill="#2dd4bf" font-family="sans-serif" font-size="10" font-weight="bold">28°C Sunny</text>
      </g>
    </g>

    <!-- Jetpack Compose Material 3 Balance Card -->
    <g transform="translate(18, 95)">
      <rect width="264" height="150" rx="16" fill="url(#m3Card)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.2" />
      
      <text x="16" y="26" fill="#cbd5e1" font-family="sans-serif" font-size="10" font-weight="bold" letter-spacing="0.5">TOTAL ENTERPRISE VALUE</text>
      <text x="16" y="58" fill="#ffffff" font-family="'Inter', sans-serif" font-size="24" font-weight="900">$48,920.50</text>
      
      <!-- Growth Badge -->
      <g transform="translate(175, 40)">
        <rect width="72" height="22" rx="11" fill="rgba(16, 185, 129, 0.3)" stroke="#10b981" stroke-width="1" />
        <text x="36" y="15" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">▲ +18.4%</text>
      </g>

      <!-- Sparkline Graph -->
      <path d="M 16 125 Q 50 115 80 120 T 140 100 T 190 95 T 248 80" fill="none" stroke="url(#chartLine)" stroke-width="3" />
      <circle cx="248" cy="80" r="4.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5" />

      <text x="16" y="140" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="8.5">MVVM + Repository UDF Engine</text>
    </g>

    <!-- Dynamic Arc Navigation Indicator Preview -->
    <g transform="translate(18, 260)">
      <rect width="264" height="100" rx="14" fill="#0c172e" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1" />
      <text x="16" y="24" fill="#2dd4bf" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">
        DYNAMIC ARC GESTURE PANEL
      </text>

      <!-- Arc Wave Geometry -->
      <path d="M 20 75 Q 80 40 140 65 T 245 45" fill="none" stroke="url(#arcGrad)" stroke-width="2.5" stroke-dasharray="4 2" />
      <circle cx="140" cy="65" r="7" fill="#06b6d4" />
      <circle cx="80" cy="40" r="5" fill="#2dd4bf" />
      <circle cx="200" cy="52" r="5" fill="#8b5cf6" />
      <text x="16" y="88" fill="#94a3b8" font-family="sans-serif" font-size="9">Canvas morphing gesture navigation</text>
    </g>

    <!-- AppWidgetProvider Card -->
    <g transform="translate(18, 375)">
      <rect width="264" height="75" rx="12" fill="#081020" stroke="rgba(255,255,255,0.08)" />
      <text x="16" y="22" fill="#e2e8f0" font-family="sans-serif" font-size="11" font-weight="bold">Home Screen AppWidget</text>
      <text x="16" y="40" fill="#64748b" font-family="sans-serif" font-size="9.5">Direct OS home screen glance &amp; deep-links</text>
      <g transform="translate(16, 48)">
        <rect width="65" height="18" rx="4" fill="#14b8a6" />
        <text x="32" y="13" fill="#040810" font-family="sans-serif" font-size="8.5" font-weight="bold" text-anchor="middle">ACTIVE</text>
      </g>
    </g>

    <!-- Android Gesture Bar -->
    <rect x="105" y="515" width="90" height="4" rx="2" fill="#64748b" />
  </g>

  <!-- RIGHT: Enterprise Full-Stack Tech Specs & Features -->
  <g transform="translate(405, 45)">
    <!-- Main Info Glass Panel -->
    <rect width="355" height="510" rx="16" fill="#081122" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <g transform="translate(25, 25)">
      <!-- Badge -->
      <rect width="170" height="24" rx="12" fill="rgba(20, 184, 166, 0.15)" stroke="#14b8a6" stroke-width="1" />
      <text x="85" y="16" fill="#2dd4bf" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">100% JETPACK COMPOSE</text>

      <text x="0" y="62" fill="#ffffff" font-family="'Inter', sans-serif" font-size="22" font-weight="900">
        Enterprise Android &amp;
      </text>
      <text x="0" y="88" fill="#2dd4bf" font-family="'Inter', sans-serif" font-size="22" font-weight="900">
        Spring Boot 3 Stack
      </text>

      <!-- Stack Details Boxes -->
      <!-- Item 1: Jetpack Compose & M3 -->
      <g transform="translate(0, 110)">
        <rect width="305" height="60" rx="10" fill="#0c172e" stroke="rgba(20, 184, 166, 0.25)" stroke-width="1" />
        <circle cx="28" cy="30" r="14" fill="#14b8a6" opacity="0.2" />
        <text x="28" y="34" fill="#2dd4bf" font-size="14" text-anchor="middle">📱</text>
        <text x="54" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Jetpack Compose + Material 3</text>
        <text x="54" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9.5">StateFlow, Coroutines, Unidirectional Data Flow</text>
      </g>

      <!-- Item 2: Spring Boot 3 REST API -->
      <g transform="translate(0, 180)">
        <rect width="305" height="60" rx="10" fill="#0c172e" stroke="rgba(99, 102, 241, 0.25)" stroke-width="1" />
        <circle cx="28" cy="30" r="14" fill="#6366f1" opacity="0.2" />
        <text x="28" y="34" fill="#818cf8" font-size="14" text-anchor="middle">🍃</text>
        <text x="54" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Spring Boot 3.3.4 + MongoDB</text>
        <text x="54" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9.5">BCrypt authentication, REST endpoints, Docker</text>
      </g>

      <!-- Item 3: Weather Engine & Widgets -->
      <g transform="translate(0, 250)">
        <rect width="305" height="60" rx="10" fill="#0c172e" stroke="rgba(6, 182, 212, 0.25)" stroke-width="1" />
        <circle cx="28" cy="30" r="14" fill="#06b6d4" opacity="0.2" />
        <text x="28" y="34" fill="#38bdf8" font-size="14" text-anchor="middle">⚡</text>
        <text x="54" y="24" fill="#f8fafc" font-family="sans-serif" font-size="11.5" font-weight="bold">Retrofit 2 &amp; Live Weather Engine</text>
        <text x="54" y="44" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Asynchronous network caching &amp; AppWidget</text>
      </g>

      <!-- Action Buttons Preview -->
      <g transform="translate(0, 325)">
        <!-- Live Demo button -->
        <g transform="translate(0, 0)">
          <rect width="145" height="42" rx="10" fill="#14b8a6" />
          <text x="72" y="26" fill="#040810" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">WATCH DEMO ↗</text>
        </g>
        <!-- APK button -->
        <g transform="translate(155, 0)">
          <rect width="150" height="42" rx="10" fill="#0f1b34" stroke="#2dd4bf" stroke-width="1.2" />
          <text x="75" y="26" fill="#2dd4bf" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">DOWNLOAD APK ⬇</text>
        </g>
      </g>

      <!-- GitHub Repo Link footer -->
      <g transform="translate(0, 390)">
        <rect width="305" height="50" rx="10" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" />
        <text x="16" y="23" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="bold">
          github.com/fahimistiaq456-netizen
        </text>
        <text x="16" y="39" fill="#2dd4bf" font-family="sans-serif" font-size="9.5">
          /MyBusinessApp • Full Source Code &amp; Docs
        </text>
      </g>
    </g>
  </g>
</svg>

