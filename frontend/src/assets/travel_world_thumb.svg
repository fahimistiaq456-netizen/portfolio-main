<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="travelSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0b172a" />
      <stop offset="45%" stop-color="#1e293b" />
      <stop offset="70%" stop-color="#334155" />
      <stop offset="90%" stop-color="#ea580c" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="mountain1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="mountain2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="sunsetSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="amberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Deep Cosmic Canvas -->
  <rect width="800" height="600" fill="#060b14" />

  <!-- Outer Browser Mockup Window -->
  <g transform="translate(40, 35)">
    <rect width="720" height="530" rx="16" fill="#09101d" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 0 16 Q 0 0 16 0 L 704 0 Q 720 0 720 16 L 720 46 L 0 46 Z" fill="#0f172a" />
    <line x1="0" y1="46" x2="720" y2="46" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <circle cx="25" cy="23" r="5.5" fill="#ef4444" />
    <circle cx="43" cy="23" r="5.5" fill="#f59e0b" />
    <circle cx="61" cy="23" r="5.5" fill="#10b981" />

    <!-- Address Bar -->
    <rect x="180" y="10" width="360" height="26" rx="13" fill="#090d16" stroke="rgba(255,255,255,0.08)" />
    <text x="360" y="27" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">
      travel-world-demo.vercel.app
    </text>

    <!-- Verified Live Pill -->
    <g transform="translate(595, 12)">
      <rect width="105" height="22" rx="11" fill="rgba(245, 158, 11, 0.18)" stroke="#f59e0b" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#f59e0b" />
      <text x="24" y="15" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="bold">VERCEL LIVE</text>
    </g>

    <!-- Travel Web App Interior -->
    <g transform="translate(20, 60)">
      <!-- Hero Scenic Banner -->
      <g>
        <clipPath id="heroClip">
          <rect width="680" height="240" rx="12" />
        </clipPath>

        <g clip-path="url(#heroClip)">
          <!-- Sky Gradient -->
          <rect width="680" height="240" fill="url(#travelSky)" />

          <!-- Sun -->
          <circle cx="520" cy="140" r="50" fill="url(#sunsetSun)" filter="url(#softGlow)" opacity="0.85" />

          <!-- Distant Mountains -->
          <polygon points="120,240 280,110 440,240" fill="url(#mountain2)" opacity="0.8" />
          <polygon points="360,240 510,90 660,240" fill="url(#mountain2)" opacity="0.85" />
          <polygon points="-40,240 100,130 240,240" fill="url(#mountain2)" opacity="0.75" />

          <!-- Foreground Mountains -->
          <polygon points="40,240 210,140 380,240" fill="url(#mountain1)" />
          <polygon points="260,240 420,120 580,240" fill="url(#mountain1)" />
          <polygon points="460,240 590,150 720,240" fill="url(#mountain1)" />

          <!-- Lake Reflection -->
          <rect x="0" y="215" width="680" height="25" fill="#091426" opacity="0.8" />

          <!-- Hero Headline Overlay -->
          <rect x="25" y="30" width="340" height="180" rx="12" fill="rgba(11, 19, 36, 0.82)" stroke="rgba(255,255,255,0.12)" />
          
          <g transform="translate(45, 52)">
            <rect width="115" height="20" rx="10" fill="rgba(245, 158, 11, 0.25)" stroke="#f59e0b" stroke-width="1" />
            <text x="12" y="14" fill="#fbbf24" font-family="sans-serif" font-size="9" font-weight="900" letter-spacing="0.5">WILD HAVEN ESCAPES</text>
          </g>

          <text x="45" y="102" fill="#ffffff" font-family="'Inter', sans-serif" font-size="20" font-weight="900" letter-spacing="-0.5">
            Discover Off-Grid <br />
            <tspan fill="#f59e0b">Luxury Cabins</tspan>
          </text>
          
          <text x="45" y="150" fill="#cbd5e1" font-family="sans-serif" font-size="11">
            Handcrafted travel escapes &amp; immersive camping.
          </text>

          <g transform="translate(45, 168)">
            <rect width="130" height="30" rx="6" fill="#f59e0b" />
            <text x="65" y="20" fill="#090d16" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
              Explore Stays ✈
            </text>
          </g>
        </g>
      </g>

      <!-- Filter Categories Bar -->
      <g transform="translate(0, 255)">
        <g transform="translate(0, 0)">
          <rect width="130" height="34" rx="8" fill="#1e293b" stroke="rgba(245,158,11,0.5)" stroke-width="1.2" />
          <text x="65" y="22" fill="#fbbf24" font-family="sans-serif" font-size="11" font-weight="bold" text-anchor="middle">🏔️ Mountain Stays</text>
        </g>
        <g transform="translate(140, 0)">
          <rect width="120" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
          <text x="60" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🌲 Forest Retreats</text>
        </g>
        <g transform="translate(270, 0)">
          <rect width="120" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
          <text x="60" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🛶 Lake Cabins</text>
        </g>
        <g transform="translate(400, 0)">
          <rect width="130" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
          <text x="65" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">⛺ Luxury Yurts</text>
        </g>
        <g transform="translate(540, 0)">
          <rect width="140" height="34" rx="8" fill="#0f172a" stroke="rgba(255,255,255,0.08)" />
          <text x="70" y="22" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">🔥 Glamping Pods</text>
        </g>
      </g>

      <!-- Destination Feature Cards -->
      <g transform="translate(0, 305)">
        <!-- Card 1 -->
        <g transform="translate(0, 0)">
          <rect width="215" height="135" rx="10" fill="#0c1527" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
          <rect width="215" height="65" rx="10" fill="#1e293b" />
          <text x="14" y="28" fill="#fbbf24" font-family="sans-serif" font-size="16">⛰️</text>
          <text x="40" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Alpine Cloud Villa</text>
          <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Zermatt, Switzerland</text>
          <text x="14" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">★ 4.98 (840 reviews)</text>
          <text x="14" y="118" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">$240 <tspan fill="#64748b" font-size="10">/ night</tspan></text>
        </g>

        <!-- Card 2 -->
        <g transform="translate(232, 0)">
          <rect width="215" height="135" rx="10" fill="#0c1527" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
          <rect width="215" height="65" rx="10" fill="#1e293b" />
          <text x="14" y="28" fill="#fbbf24" font-family="sans-serif" font-size="16">🌲</text>
          <text x="40" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Whispering Pines</text>
          <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Banff, Alberta</text>
          <text x="14" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">★ 4.92 (1,120 reviews)</text>
          <text x="14" y="118" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">$175 <tspan fill="#64748b" font-size="10">/ night</tspan></text>
        </g>

        <!-- Card 3 -->
        <g transform="translate(465, 0)">
          <rect width="215" height="135" rx="10" fill="#0c1527" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
          <rect width="215" height="65" rx="10" fill="#1e293b" />
          <text x="14" y="28" fill="#fbbf24" font-family="sans-serif" font-size="16">🌊</text>
          <text x="40" y="28" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Fjord Glass Pod</text>
          <text x="14" y="48" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Lofoten, Norway</text>
          <text x="14" y="90" fill="#cbd5e1" font-family="sans-serif" font-size="10.5">★ 4.99 (670 reviews)</text>
          <text x="14" y="118" fill="#f59e0b" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold">$295 <tspan fill="#64748b" font-size="10">/ night</tspan></text>
        </g>
      </g>
    </g>
  </g>
</svg>

