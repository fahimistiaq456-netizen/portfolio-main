<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="nexusBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a16" />
      <stop offset="50%" stop-color="#0a1226" />
      <stop offset="100%" stop-color="#040710" />
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="panelGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f1b33" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#091222" stop-opacity="0.95" />
    </linearGradient>

    <filter id="glowFilt" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <pattern id="nexusGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="rgba(6, 182, 212, 0.07)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="800" height="600" fill="url(#nexusBg)" />
  <rect width="800" height="600" fill="url(#nexusGrid)" />

  <circle cx="700" cy="150" r="170" fill="#06b6d4" opacity="0.1" filter="url(#glowFilt)" />
  <circle cx="150" cy="450" r="160" fill="#3b82f6" opacity="0.09" filter="url(#glowFilt)" />

  <g transform="translate(40, 35)">
    <!-- Main Window Container -->
    <rect width="720" height="530" rx="16" fill="#08101d" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5" />

    <!-- Window Header -->
    <path d="M 0 16 Q 0 0 16 0 L 704 0 Q 720 0 720 16 L 720 48 L 0 48 Z" fill="#0c172c" />
    <line x1="0" y1="48" x2="720" y2="48" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

    <circle cx="25" cy="24" r="5.5" fill="#ef4444" />
    <circle cx="43" cy="24" r="5.5" fill="#f59e0b" />
    <circle cx="61" cy="24" r="5.5" fill="#10b981" />

    <text x="360" y="29" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" text-anchor="middle" letter-spacing="1">
      Nexus Enterprise • Semantic Discovery &amp; Knowledge Hub
    </text>

    <!-- SSO Status Badge -->
    <g transform="translate(565, 13)">
      <rect width="135" height="22" rx="11" fill="rgba(6, 182, 212, 0.15)" stroke="rgba(6, 182, 212, 0.5)" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#06b6d4" />
      <text x="24" y="15" fill="#22d3ee" font-family="sans-serif" font-size="9" font-weight="bold" letter-spacing="0.5">OKTA / AZURE SSO</text>
    </g>

    <!-- Top Stats Row -->
    <g transform="translate(25, 65)">
      <!-- Metric 1 -->
      <g transform="translate(0, 0)">
        <rect width="210" height="58" rx="8" fill="#0b1426" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="bold">INDEXED ENTERPRISE CORPUS</text>
        <text x="14" y="44" fill="#f8fafc" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="bold">128,400 <tspan fill="#06b6d4" font-size="11">Chunks</tspan></text>
      </g>

      <!-- Metric 2 -->
      <g transform="translate(230, 0)">
        <rect width="210" height="58" rx="8" fill="#0b1426" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="bold">SEMANTIC PASSAGE RETRIEVAL</text>
        <text x="14" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="bold">99.8% <tspan fill="#94a3b8" font-size="11">Grounded</tspan></text>
      </g>

      <!-- Metric 3 -->
      <g transform="translate(460, 0)">
        <rect width="210" height="58" rx="8" fill="#0b1426" stroke="rgba(255,255,255,0.06)" />
        <text x="14" y="20" fill="#64748b" font-family="sans-serif" font-size="10" font-weight="bold">VECTOR PIPELINE LATENCY</text>
        <text x="14" y="44" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="17" font-weight="bold">18.6 ms <tspan fill="#94a3b8" font-size="11">End-to-End</tspan></text>
      </g>
    </g>

    <!-- Center Workspace -->
    <g transform="translate(25, 140)">
      <!-- Left: Vector Knowledge Graph Visualizer -->
      <g transform="translate(0, 0)">
        <rect width="360" height="365" rx="12" fill="url(#panelGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">
          SEMANTIC CITATION GRAPH
        </text>
        <line x1="18" y1="40" x2="342" y2="40" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

        <!-- Graph Visualization Lines -->
        <g stroke="rgba(6, 182, 212, 0.35)" stroke-width="1.5">
          <line x1="180" y1="180" x2="90" y2="100" />
          <line x1="180" y1="180" x2="270" y2="90" />
          <line x1="180" y1="180" x2="80" y2="270" />
          <line x1="180" y1="180" x2="280" y2="280" />
          <line x1="90" y1="100" x2="270" y2="90" stroke-dasharray="3 3" opacity="0.5" />
          <line x1="80" y1="270" x2="280" y2="280" stroke-dasharray="3 3" opacity="0.5" />
        </g>

        <!-- Nodes -->
        <!-- Center Query Node -->
        <circle cx="180" cy="180" r="28" fill="#082f49" stroke="#06b6d4" stroke-width="2.5" />
        <text x="180" y="184" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="middle">QUERY</text>

        <!-- Node 1 -->
        <circle cx="90" cy="100" r="22" fill="#0c1d38" stroke="#38bdf8" stroke-width="2" />
        <text x="90" y="104" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Doc #1</text>

        <!-- Node 2 -->
        <circle cx="270" cy="90" r="24" fill="#0c1d38" stroke="#818cf8" stroke-width="2" />
        <text x="270" y="94" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Passage</text>

        <!-- Node 3 -->
        <circle cx="80" cy="270" r="20" fill="#0c1d38" stroke="#34d399" stroke-width="2" />
        <text x="80" y="274" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">Vector</text>

        <!-- Node 4 -->
        <circle cx="280" cy="280" r="22" fill="#0c1d38" stroke="#f472b6" stroke-width="2" />
        <text x="280" y="284" fill="#f1f5f9" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">Graph</text>

        <rect x="20" y="325" width="320" height="26" rx="6" fill="#061224" />
        <text x="180" y="342" fill="#64748b" font-family="'JetBrains Mono', monospace" font-size="9.5" text-anchor="middle">
          Embedding Dim: 1536 • Cosine Grounding Active
        </text>
      </g>

      <!-- Right: Document Ingestion & Passage Studio -->
      <g transform="translate(380, 0)">
        <rect width="290" height="365" rx="12" fill="url(#panelGrad)" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />
        <text x="18" y="28" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">
          DOCUMENT INGESTION STUDIO
        </text>
        <line x1="18" y1="40" x2="272" y2="40" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1" />

        <!-- Ingestion Box -->
        <g transform="translate(18, 55)">
          <rect width="254" height="110" rx="8" fill="#091426" stroke="rgba(6, 182, 212, 0.4)" stroke-dasharray="5 4" stroke-width="1.2" />
          <circle cx="127" cy="38" r="18" fill="rgba(6, 182, 212, 0.15)" />
          <text x="127" y="44" fill="#22d3ee" font-family="sans-serif" font-size="16" text-anchor="middle">📥</text>
          <text x="127" y="74" fill="#f1f5f9" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" text-anchor="middle">
            Enterprise PDF Dropzone
          </text>
          <text x="127" y="92" fill="#64748b" font-family="sans-serif" font-size="9" text-anchor="middle">
            Automated OCR, Chunking &amp; Vector Pipeline
          </text>
        </g>

        <!-- Compliance & Security Badges -->
        <g transform="translate(18, 180)">
          <text x="0" y="16" fill="#cbd5e1" font-family="sans-serif" font-size="11" font-weight="bold">Enterprise Compliance</text>
          
          <g transform="translate(0, 30)">
            <rect width="254" height="34" rx="6" fill="#0a1529" stroke="rgba(255,255,255,0.06)" />
            <text x="12" y="21" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="bold">🔒 SOC 2 Type II &amp; HIPAA Ready</text>
          </g>

          <g transform="translate(0, 72)">
            <rect width="254" height="34" rx="6" fill="#0a1529" stroke="rgba(255,255,255,0.06)" />
            <text x="12" y="21" fill="#34d399" font-family="sans-serif" font-size="10" font-weight="bold">🛡️ Role-Based Access Control (RBAC)</text>
          </g>

          <!-- Live app link badge -->
          <g transform="translate(0, 116)">
            <rect width="254" height="40" rx="8" fill="rgba(6, 182, 212, 0.12)" stroke="rgba(6, 182, 212, 0.4)" />
            <text x="127" y="18" fill="#22d3ee" font-family="sans-serif" font-size="10.5" font-weight="bold" text-anchor="middle">
              Launch Live Enterprise System ↗
            </text>
            <text x="127" y="32" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="8.5" text-anchor="middle">
              enterprise-rag-assistant.vercel.app
            </text>
          </g>
        </g>
      </g>
    </g>
  </g>
</svg>

